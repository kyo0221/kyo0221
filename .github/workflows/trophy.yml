name: GitHub Profile Trophy
on:
  # 毎日0時（UTC）に自動実行
  schedule:
    - cron: "0 0 * * *"
  # 手動実行も可能にする
  workflow_dispatch:
  # mainブランチへのpushでも実行
  push:
    branches:
      - main
concurrency:
  group: profile-readme-assets
  cancel-in-progress: false
jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy
        # ブランチ参照はforce-pushで壊れるためコミットSHAで固定する
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          # GITHUB_TOKENではcontributionsCollection等のユーザースコープが取得できない
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          username: kyo0221
          file: output/trophy.svg
          theme: flat
          max-cols: 4
          max-rows: 2
          panel-size: 110
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: true

      # git-auto-commit-actionはpush前にrebaseしないため、生成中に他ワークフローが
      # mainへコミットするとnon-fast-forwardで失敗する。rebaseしてリトライする。
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/trophy.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update trophy"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "Failed to push after 5 attempts"
          exit 1
