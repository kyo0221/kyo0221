name: GitHub Profile Trophy
on:
  # 毎日0時（UTC）に自動実行
  schedule:
    - cron: "0 0 * * *"
  # 手動実行も可能にする
  workflow_dispatch:
  # mainブランチへのpushでも実行
  push:
    branches:
      - main
concurrency:
  group: profile-readme-assets
  cancel-in-progress: false
jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy
        # ブランチ参照はforce-pushで壊れるためコミットSHAで固定する
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          # GITHUB_TOKENではcontributionsCollection等のユーザースコープが取得できない
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          username: kyo0221
          file: output/trophy.svg
          theme: flat
          max-cols: 4
          max-rows: 2
          panel-size: 110
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: true

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy"
          file_pattern: output/trophy.svg
